<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Proxy Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🌌 サイバー背景用のキャンバス -->
    <canvas id="cyberBg"></canvas>

    <div class="header">
        <h1>プロキシランチャー</h1>
    </div>

    <div class="container">
        <div class="searching-text" id="searchingText">プロキシサーバーを接続テスト中<span class="dots"></span></div>
        <div id="serverList"></div>
    </div>

    <div class="footer">
        <div class="button-row">
            <button id="btnConnect" disabled>サーバーに接続</button>
            <button id="btnSettingsOpen">設定</button>
            <button id="btnServerAddOpen">サーバーを追加</button>
        </div>
        <div class="button-row">
            <button id="btnEdit" disabled>編集</button>
            <button id="btnDelete" disabled>削除</button>
            <button id="btnRefresh">更新</button>
        </div>
    </div>

    <!-- サーバー登録・編集用モーダル（一括追加エリアを統合） -->
    <div class="modal" id="proxyModal">
        <div class="modal-content" style="width: 460px;">
            <h2 id="modalTitle" style="margin:0; font-size:18px;">サーバー情報の追加</h2>
            
            <!-- 🛠️ モード切り替えタブ -->
            <div style="display:flex; gap:10px; margin: 15px 0 5px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">
                <span id="tabSingle" style="cursor:pointer; font-weight:bold; font-size:13px; padding:4px 8px; border-bottom:2px solid var(--title-color);">単体追加</span>
                <span id="tabBulk" style="cursor:pointer; font-weight:bold; font-size:13px; padding:4px 8px; color:gray;">一括追加</span>
            </div>

            <!-- ① 単体追加用の入力欄 -->
            <div id="areaSingleMode">
                <p>プロキシの表示名</p>
                <input type="text" id="inputName" placeholder="例: My Utopia Proxy">
                <p>プロキシのURL (串のリンク)</p>
                <input type="text" id="inputAddress" placeholder="例: https://utopia-link.com">
            </div>

            <!-- ② 🛠️ 一括追加用の入力欄（デフォルト非表示） -->
            <div id="areaBulkMode" style="display:none; text-align:left;">
                <p>複数URLを一括入力（改行、スペース、カンマ区切り）</p>
                <textarea id="textareaBulk" rows="6" placeholder="【入力例1：URLのみ】&#10;https://proxy1.com&#10;https://proxy2.com&#10;&#10;【入力例2：名前とURLペア】&#10;プロキシA https://proxyA.com&#10;プロキシB,https://proxyB.com" style="width:100%; background-color: var(--input-bg); border: 2px solid var(--border-color); color: var(--text-color); padding: 10px; box-sizing: border-box; font-size: 13px; font-family: monospace; resize: vertical; margin-bottom: 12px;"></textarea>
                <p style="color:#666; font-size:11px; margin:0 0 10px 0;">※名前が無い場合は自動的にURLのドメイン名が登録名になります。</p>
            </div>
            
            <p>所属フォルダ</p>
            <select id="selectFolder"></select>

            <div class="button-row" style="margin-top:20px; gap:10px;">
                <button id="btnModalSave">完了</button>
                <button id="btnModalClose">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- 設定用モーダル -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2 style="margin:0; font-size:18px; padding-bottom:10px; border-bottom:2px solid var(--border-color);">ランチャー環境設定</h2>
            
            <div class="setting-row">
                <span style="font-weight:bold;">ダークモード (Dark Mode)</span>
                <button id="btnToggleDark" style="max-width:100px; padding:6px 0; font-size:14px;">OFF</button>
            </div>

            <div class="setting-section-title">フォルダ管理</div>
            <div class="setting-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <span style="font-size:13px; opacity:0.8;">新しいフォルダを追加：</span>
                <div style="display:flex; width:100%; gap:8px;">
                    <input type="text" id="inputNewFolder" placeholder="フォルダ名を入力" style="margin:0; padding:6px; background:var(--input-bg); border:1px solid var(--border-color); color:var(--text-color); flex:1;">
                    <button id="btnCreateFolder" style="max-width:80px; padding:6px 0; font-size:13px;">追加</button>
                </div>
            </div>

            <div class="setting-row" style="flex-direction: column; align-items: flex-start; gap: 8px; border-bottom: none;">
                <span style="font-size:13px; opacity:0.8;">フォルダの名前を変更：</span>
                <div style="display:flex; width:100%; gap:8px; align-items:center; margin-bottom: 4px;">
                    <select id="selectRenameTarget" style="margin:0; padding:6px; flex:1; height:33px; font-size:13px;"></select>
                    <span style="font-size:12px;">➔</span>
                    <input type="text" id="inputRenameFolder" placeholder="新しい名前" style="margin:0; padding:6px; background:var(--input-bg); border:1px solid var(--border-color); color:var(--text-color); flex:1; font-size:13px;">
                </div>
                <button id="btnRenameFolder" style="max-width:100%; padding:6px 0; font-size:13px; width:100px; align-self:flex-end;">名前を変更</button>
            </div>

            <div class="button-row" style="margin-top:25px;">
                <button id="btnSettingsClose" style="max-width:100%;">閉じる</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
